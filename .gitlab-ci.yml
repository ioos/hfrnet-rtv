variables:
  GIT_LFS_SKIP_SMUDGE: "1"

stages:
    - pre
    - test

include:
  - component: ${CI_SERVER_HOST}/ci-catalog/security/secret_detection@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/dependency_scanning@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/icode_sast@main
  - component: ${CI_SERVER_HOST}/ci-catalog/security/checkov_sast@~latest
    inputs:
      test_results: "true"
  - component: ${CI_SERVER_HOST}/ci-catalog/security/sast@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/container_scanning@~latest
    inputs: 
      dockerfile: docker/process/Dockerfile
      image: $CI_REGISTRY_IMAGE/process:latest
      git_strategy: fetch
      job_name: container_scanning_process
  - component: ${CI_SERVER_HOST}/ci-catalog/security/inspector_scanning@~latest
    inputs: 
      image: $CI_REGISTRY_IMAGE/process:latest
      job_name: inspector_scanning_process
  - component: ${CI_SERVER_HOST}/ssboxes/common/assistt/ci-templates/create_container@main

lint-job:
    stage: test
    image: registry.services.nesdis.noaa.gov/ssboxes/common/assistt/images/assistt-ci-utils:v1.0
    script:
        - echo “Linting the HFR Algorithm”
        - pylint --ignore-patterns='[.]*yaml' --recursive=y packages/* srappers/*
    allow_failure: true
            
test-job:
    stage: test
    script:
        - echo “No test has been created yet”