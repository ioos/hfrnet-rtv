variables:
  GIT_LFS_SKIP_SMUDGE: "1"
  
stages:
  - pre
  - test
  - release
  - register

include:
  - component: ${CI_SERVER_HOST}/ci-catalog/security/secret_detection@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/dependency_scanning@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/icode_sast@main
  - component: ${CI_SERVER_HOST}/ci-catalog/security/checkov_sast@~latest
    inputs:
      test_results: "true"
  - component: ${CI_SERVER_HOST}/ci-catalog/security/sast@~latest
  - component: ${CI_SERVER_HOST}/ci-catalog/security/container_scanning@~latest
    inputs: 
      dockerfile: docker/process/Dockerfile
      image: $CI_REGISTRY_IMAGE/process:latest
      git_strategy: fetch
      job_name: container_scanning_process
  - component: ${CI_SERVER_HOST}/ci-catalog/security/inspector_scanning@~latest
    inputs: 
      image: $CI_REGISTRY_IMAGE/process:latest
      job_name: inspector_scanning_process
  - component: ${CI_SERVER_HOST}/ssboxes/common/assistt/ci-templates/create_container@main
  - project: "ssboxes/common/assistt/ci-templates"
    ref: 'main'
    file:
      - ".gitlab-ci-template.yml"

lint-job:
  stage: test
  image: registry.services.nesdis.noaa.gov/ssboxes/common/assistt/images/assistt-ci-utils:v1.0
  script:
    - echo “Linting the HFR Algorithm”
    - pylint --ignore-patterns='[.]*yaml' --recursive=y packages/* srappers/*
  allow_failure: true
            
test-job:
  stage: test
  script:
    - echo “No test has been created yet”

release/dev:
  stage: release
  extends: 
    - .login_aws_ecr
  variables:
    GIT_LFS_SKIP_SMUDGE: "0"
    AWS_PROFILE: nesdis-osgs-nccf-dev-5006
    ENV: nesdis-nccfdev5006-pg
    AWS_ECR_URL: 560271376700.dkr.ecr.us-east-1.amazonaws.com
    ECR_IMAGE: ${AWS_ECR_URL}/ao-hfrnet
  id_tokens: !reference [.get_token]
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} -f Dockerfile .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
    - docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} ${ECR_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${ECR_IMAGE}:${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null && $CI_COMMIT_TAG =~ /^(v)?\d+.\d+.\d+$/'

register/dev:
  stage: register
  image: "registry.services.nesdis.noaa.gov/product-generation/algorithm-orchestration/ao/libraries/ao-ci-tools/tf-ci:latest"
  id_tokens: !reference [.get_token]
  variables:
    ENV: nesdis-nccfdev5006-pg
    AWS_ECR_URL: 560271376700.dkr.ecr.us-east-1.amazonaws.com
    ECR_IMAGE: ${AWS_ECR_URL}/ao-hfrnet
    AWS_PROFILE: nesdis-osgs-nccf-dev-5006
    IMAGE_LOC: $ECR_IMAGE:$CI_COMMIT_TAG
  parallel:
    matrix:
    - ALGORITHM_NAME: HFRNet
      PR_YAML: test_data/HFRNet-Production-Rules.yml
  before_script:
    - !reference [.set_token]
  script:
    - pip install ao_register --index-url https://gitlab-ci-token:${CI_JOB_TOKEN}@git.services.nesdis.noaa.gov/api/v4/projects/10095/packages/pypi/simple
    - |
      ao_register CREATE -v \
      --sa_name $ALGORITHM_NAME \
      --version $CI_COMMIT_TAG \
      --rule_file $PR_YAML \
      --container_location $IMAGE_LOC \
      --artifacts_location None \
      --env $ENV \
      --rule_bucket ${ENV}-ao-algorithm-shared
  rules:
    - if: '$CI_COMMIT_TAG != null && $CI_COMMIT_TAG =~ /^(v)?\d+.\d+.\d+$/'